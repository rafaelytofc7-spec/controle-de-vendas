name: backup-v3
on:
  schedule:
    - cron: "23 * * * *"   # de hora em hora (UTC)
  workflow_dispatch:
    inputs:
      completo:
        description: "Baixar tudo de novo (1) em vez de só o que mudou"
        default: "0"
permissions:
  contents: write
concurrency:
  group: backup-v3
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exportar do Supabase (só leitura)
        run: node v3/backup.mjs
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          V3_BACKUP_CHAVE: ${{ secrets.V3_BACKUP_CHAVE }}
          LOJAS: "principal ensaio"
          COMPLETO: ${{ github.event.inputs.completo || '0' }}
      - name: Gravar no repositório
        if: always()
        run: |
          git config user.name "backup-v3"
          git config user.email "backup-v3@users.noreply.github.com"
          git add v3
          # só grava se mudou algo além do estado (evita commit vazio toda hora)
          if git diff --cached --name-only | grep -qv '/estado.json$'; then
            git commit -q -m "backup v3 $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          else
            echo "nada novo"
          fi
